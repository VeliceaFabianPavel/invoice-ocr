# ---------------------------------------------------------------------------
# Default configuration.
#
# Every key can be overridden without rebuilding, in this order of precedence:
#   1. JVM system properties      -Docr.tessdata.path=...
#   2. environment variables      OCR_TESSDATA_PATH=...
#   3. invoice-ocr.properties     placed next to the jar
#   4. this file
# ---------------------------------------------------------------------------

# Directory holding the *.traineddata files. This is the one setting you must
# adjust for your machine.
ocr.tessdata.path=C:/Program Files/Tesseract-OCR/tessdata

# Tesseract language(s). Combine with a plus sign, e.g. ron+eng for Romanian
# invoices that contain English terms. The matching <lang>.traineddata must exist.
ocr.language=eng

# Page segmentation mode: 3 = fully automatic, 6 = assume a single block,
# 4 = a single column of variable-size text (often best for invoices).
ocr.pageSegmentationMode=3

# OCR engine mode: 3 = whatever the installation provides, 1 = LSTM only.
ocr.engineMode=3

# Formats offered in the file chooser and accepted by the loader.
document.supportedExtensions=png,jpg,jpeg,bmp,tif,tiff,gif

# Image preparation before recognition.
image.preprocessing.enabled=true
image.preprocessing.minimumWidth=1000

# UI language as a BCP 47 tag (ro, en, ...). Remove to follow the system locale.
ui.locale=ro

# Format the export dialog opens on: pdf, txt, md, html, json, xml or csv.
export.defaultFormat=pdf

# ---------------------------------------------------------------------------
# Recognition passes (1.2.0)
#
# A page is read up to this many times, each with a different preparation of
# the image and a different assumption about its layout, and the readings are
# then merged field by field. Later passes are only paid for when the earlier
# ones left something unread or unsure, so a clean scan still costs one pass.
#
#   1 = the single-pass behaviour of 1.1
#   4 = plain, straightened, binarised, sharpened (the default)
# ---------------------------------------------------------------------------
ocr.passes.maximum=4

# Mean confidence at which a reading is accepted without trying another
# preparation. Raise it for accuracy on difficult scans, lower it for speed.
ocr.passes.targetConfidence=0.80

# Read the goods table as well as the header fields. The rows are exported,
# and their sum is used to check the net amount.
extraction.lineItems.enabled=true

# Mark values that were inferred rather than read, and carry the table rows
# into reports.
report.showConfidence=true
report.lineItems=true
